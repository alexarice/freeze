[package]
name = "freeze"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
anyhow = "1.0"
nix = { version = "0.27", features = ["fs"] }
tiny-skia = "0.11"
memmap2 = "0.9"
